name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Generate test coverage
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify application starts
      run: |
        # Create a minimal .env.local for testing
        cat > .env.local << 'EOF'
        PORT=3000
        NODE_ENV=test
        DB_URL=mongodb://localhost:27017
        DB_NAME=test_db
        JWT_SECRET=test_secret_for_ci
        JWT_SECRET_VERIFICATION=test_verification_secret_for_ci
        RAZOR_PAY_KEY_ID=test_key
        RAZOR_PAY_KEY_SECRET=test_secret
        BASE_URL=http://localhost:3000
        SEND_GRID_KEY=test_key
        SENDER_EMAIL=test@example.com
        PRIMARY_PICKUP_NAME=test_pickup
        SHIPROCKET_EMAIL=test@example.com
        SHIPROCKET_PASSWORD=test_password
        TWILIO_ACCOUNT_SID=test_sid
        TWILIO_AUTH_TOKEN=test_token
        TWILIO_VERIFY_SERVICEID=test_service
        GOOGLE_CLIENT_ID=test_client_id
        OTPLESS_CLIENT_ID=test_otpless_client_id
        OTPLESS_CLIENT_SECRET=test_otpless_client_secret
        EOF
        # Verify the app can start (timeout after 10 seconds)
        timeout 10s npm start || exit_code=$?
        if [ $exit_code -ne 124 ]; then
          echo "Application failed to start"
          exit 1
        fi
        echo "Application started successfully"

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Check for vulnerabilities
      run: npm audit --json > audit.json || true

    - name: Upload audit results
      uses: actions/upload-artifact@v4
      with:
        name: security-audit
        path: audit.json